name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure test tools
        run: |
          for tool in shellcheck age; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          shellcheck --version
          age --version

      - name: ShellCheck
        run: ./scripts/lint.sh

      - name: Regression tests
        run: ./scripts/test.sh
